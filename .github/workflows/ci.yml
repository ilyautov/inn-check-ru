name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: ruff
        run: |
          pip install ruff
          ruff check scripts/ eval/ mcp/ calibration/ packaging/

      - name: skill frontmatter is valid YAML
        run: |
          pip install pyyaml
          python3 - <<'EOF'
          import pathlib, yaml
          text = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---"), "SKILL.md must start with frontmatter"
          fm = yaml.safe_load(text.split("---")[1])
          for key in ("name", "description"):
              assert fm.get(key), f"frontmatter missing {key}"
          assert fm["name"] == "inn-check-ru"
          print("frontmatter ok:", fm["name"])
          EOF

      - name: version gate (одна версия везде)
        run: python3 eval/run_version_gate.py

      - name: гейт рабочих процессов (имена шагов, ссылки на скрипты)
        run: python3 eval/run_workflows_gate.py

      - name: social preview на актуальных счётчиках
        run: |
          pip install pillow
          python3 scripts/make_social_preview.py --check

      - name: "гейт скилла: вынесенные разделы, ссылки и релизный архив"
        run: python3 eval/run_skill_gate.py

      - name: release zip собирается (SKILL.md в корне)
        run: |
          python3 scripts/build_release_zip.py
          python3 - <<'EOF'
          import zipfile
          names = zipfile.ZipFile("dist/inn-check-ru.zip").namelist()
          assert "SKILL.md" in names, "SKILL.md должен быть в корне архива"
          print("zip ok:", len(names), "файлов")
          EOF

      - name: fin_scoring eval (офлайн, фикстуры)
        run: python3 eval/run_fin_eval.py

      - name: diff_counterparty eval (офлайн, фикстуры)
        run: python3 eval/run_diff_eval.py

      - name: graph + droblenie eval (офлайн, фикстуры)
        run: python3 eval/run_graph_eval.py

      - name: registries eval (офлайн, фикстуры)
        run: python3 eval/run_registries_eval.py

      - name: реестр источников валиден
        run: python3 scripts/sources.py

      - name: fetch парсеры против записанных ответов ФНС + дрейф схемы (офлайн)
        run: python3 eval/run_fetch_eval.py

      - name: check_access классификатор (офлайн)
        run: python3 eval/run_access_eval.py

      - name: install_ca конвертация и отпечатки (офлайн)
        run: python3 eval/run_ca_eval.py

      - name: профили цели проверки (офлайн)
        run: python3 eval/run_profiles_eval.py

      - name: батч-проверка (офлайн)
        run: python3 eval/run_batch_eval.py

      - name: "мониторинг: отпечатки и список наблюдения (офлайн)"
        run: python3 eval/run_watchlist_eval.py

      - name: "санкционные перечни: парсер и сверка (офлайн)"
        run: python3 eval/run_sanctions_eval.py

      - name: "список ЦБ (warning-list): разбор, кэш, сигнал (офлайн)"
        run: python3 eval/run_cbr_warning_eval.py

      - name: "--офлайн: ни одного сетевого вызова (audit-хук)"
        run: python3 eval/run_offline_eval.py

      - name: колесо содержит canon и CLI работает из чистого venv
        shell: bash
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir "$RUNNER_TEMP/whl"
          # без grep -q: под pipefail ранний выход grep роняет unzip по SIGPIPE
          unzip -Z1 "$RUNNER_TEMP"/whl/*.whl | grep -Fx 'inn_check_ru_data/canon_ru.json' \
            || { echo "в колесе нет inn_check_ru_data/canon_ru.json" >&2; exit 1; }
          # без таблицы норм benchmarks из установленного пакета отвечает
          # «нормы не построены» на каждый запрос
          unzip -Z1 "$RUNNER_TEMP"/whl/*.whl | grep -Fx 'inn_check_ru_data/benchmarks_ru.json' \
            || { echo "в колесе нет inn_check_ru_data/benchmarks_ru.json" >&2; exit 1; }
          python -m venv "$RUNNER_TEMP/whl-venv"
          "$RUNNER_TEMP/whl-venv/bin/pip" install --quiet "$RUNNER_TEMP"/whl/*.whl
          cd "$RUNNER_TEMP"   # не из checkout: иначе канон найдётся по пути репозитория
          out=$("$RUNNER_TEMP/whl-venv/bin/inn-check-ru" 123 || true)   # exit 1 ожидаем
          grep -F 'Некорректный ИНН' <<<"$out"
          "$RUNNER_TEMP/whl-venv/bin/python" - <<'PY'
          import droblenie_check as d
          canon = d._load_canon()
          assert isinstance(canon, dict) and "ндс_усн_освобождение" in canon, canon
          print("canon из колеса ok:", sorted(canon))
          import benchmarks, sources
          таблица, причина = benchmarks.загрузить()
          assert таблица, "нормы из колеса не читаются: %s" % причина
          print("нормы из колеса ok:", таблица["групп"], "групп")
          assert "ндс_вычет" in sources.PROFILE_IDS, sources.PROFILE_IDS
          import dossier, extract_inn, opendata_index, opendata_refresh, paper_vat  # noqa: F401
          import retro_verdict  # noqa: F401
          import cbr_warning  # noqa: F401 — fetch_counterparty грузит его рядом
          print("модули волны 3 импортируются из колеса")
          # check_access делает `import proxy`: забудь модуль в py-modules —
          # и установленный пакет падает на probe, хотя из репозитория работает.
          import check_access, proxy
          конф = proxy.настройка(None, env={"HTTPS_PROXY": "http://узел:3128"})
          assert конф["источник"] == "HTTPS_PROXY", конф
          assert "сеть" in check_access.build_report([], "неизвестно"), "нет отметки сети"
          print("прокси из колеса ok:", конф["отпечаток"])
          PY

      # Команда, которую клиент реестра MCP соберёт по server.json. Сервер может
      # быть исправен, а команда — запускать не его (до 1.11.1 так и было: CLI
      # проверки ИНН). Колесо движка — из прошлого шага, обёртка — здесь.
      - name: "`uvx inn-check-ru-mcp` поднимает сервер (путь реестра MCP)"
        shell: bash
        run: |
          python -m pip install --quiet uv
          python -m build --wheel packaging/inn-check-ru-mcp --outdir "$RUNNER_TEMP/whl-mcp"
          V=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/eval/mcp_handshake.py" \
            uvx --no-cache --find-links "$RUNNER_TEMP/whl" --find-links "$RUNNER_TEMP/whl-mcp" \
            "inn-check-ru-mcp==$V"

      # Расширение Claude Desktop (.mcpb, тип uv): хост ставит inn-check-ru[mcp]
      # той же версии и запускает обёртку. Версии ещё нет на PyPI — колесо движка
      # из шага выше подставляется через UV_FIND_LINKS.
      - name: "расширение .mcpb: манифест валиден, сервер поднимается"
        shell: bash
        run: |
          python3 packaging/mcpb/build.py --каталог
          npx -y @anthropic-ai/mcpb@2.1.2 validate dist/mcpb/manifest.json
          UV_FIND_LINKS="$RUNNER_TEMP/whl" python3 eval/mcp_handshake.py \
            uv run --no-cache --directory "$GITHUB_WORKSPACE/dist/mcpb" src/server.py

      # Docker MCP Registry собирает образ из Dockerfile и проверяет tools/list —
      # тот же путь здесь: сломанный образ всплыл бы только в их CI.
      - name: "Docker-образ поднимает MCP-сервер (путь Docker MCP Registry)"
        run: |
          docker build -t inn-check-ru-mcp:ci .
          python3 eval/mcp_handshake.py docker run -i --rm inn-check-ru-mcp:ci

      - name: "отраслевые нормы: агрегация и порог публикации (офлайн)"
        run: python3 eval/run_benchmarks_eval.py

      - name: "бумажный НДС: признаки и три состояния (офлайн)"
        run: python3 eval/run_paper_vat_eval.py

      - name: "досье осмотрительности: Markdown и DOCX (офлайн)"
        run: python3 eval/run_dossier_eval.py

      - name: извлечение ИНН из документов (офлайн)
        run: python3 eval/run_extract_eval.py

      - name: "поиск по ИНН в дампах ФНС: индекс и три состояния (офлайн)"
        run: python3 eval/run_opendata_index_eval.py

      - name: "ретроспектива: вердикт на дату в прошлом (офлайн)"
        run: python3 eval/run_retro_eval.py

      - name: "калибровка порогов: разметка, веса, без утечки будущего (офлайн)"
        run: python3 eval/run_calibration_eval.py

      - name: "пакет доказательств: сырьё, манифест, штамп RFC 3161 (офлайн)"
        run: python3 eval/run_evidence_pack_eval.py

      - name: mcp server smoke test
        run: |
          pip install -r mcp/requirements.txt
          python3 mcp/test_server.py

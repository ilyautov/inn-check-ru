name: Publish to PyPI

# На каждый опубликованный GitHub Release: собрать пакет inn-check-ru и
# выложить на PyPI через Trusted Publishing (OIDC), без токена в секретах.
# Паттерн humanizer-ru.
#
# Разовая настройка на стороне PyPI, ДО первого релиза после подключения
# (подробно в PUBLISHING.md):
#   pypi.org -> Your account -> Publishing -> Add a new pending publisher
#     PyPI project name: inn-check-ru
#     Owner:             ilyautov
#     Repository name:   inn-check-ru
#     Workflow name:     publish-pypi.yml   <-- ровно имя этого файла
#     Environment name:  (пусто)
#
# Триггер — ПУШ ТЕГА, а не «release: published». Релиз создаёт release.yml
# через GITHUB_TOKEN, а события от GITHUB_TOKEN новых прогонов не запускают
# (защита GitHub от петель). Поэтому цепочка «тег -> Release -> публикация»
# выглядела рабочей и не отработала НИ РАЗУ: три релиза, ноль прогонов этого
# файла, PyPI отдавал 404. Проверено 23.09.2026. Подписка на release оставлена
# на случай релиза, созданного человеком; на такой случай — concurrency, чтобы
# два прогона одного тега не лезли на PyPI одновременно.
# workflow_dispatch нужен, чтобы до-опубликовать уже выпущенный тег.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег релиза, например v1.6.0"
        required: true

concurrency:
  group: publish-pypi-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pypi:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC -> Trusted Publishing на PyPI
    steps:
      - name: Определить тег
        id: tag
        shell: bash
        env:
          REF: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "тег не похож на vX.Y.Z: $REF" >&2; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Версия в теге должна совпасть с pyproject.toml
        shell: bash
        env:
          V: ${{ steps.tag.outputs.version }}
        run: |
          # Два пакета, одна версия: обёртка inn-check-ru-mcp пришпилена к движку `==`.
          for f in pyproject.toml packaging/inn-check-ru-mcp/pyproject.toml; do
            PKG=$(python -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1],"rb"))["project"]["version"])' "$f")
            echo "тег=$V $f=$PKG"
            [ "$V" = "$PKG" ] || { echo "версия тега не совпала с $f" >&2; exit 1; }
          done

      - name: Эта версия уже на PyPI? Тогда выходим без ошибки
        id: check
        shell: bash
        env:
          V: ${{ steps.tag.outputs.version }}
        run: |
          # Выходим, только если на PyPI уже ОБА пакета этой версии. Один из двух —
          # это недопубликованный релиз (например, у обёртки не было publisher),
          # его надо доделать; уже залитый файл пропустит skip-existing ниже.
          # имена переменных в bash — только ASCII: `есть=0` bash счёл бы командой
          have=0
          for pkg in inn-check-ru inn-check-ru-mcp; do
            if curl -fsS "https://pypi.org/pypi/$pkg/$V/json" >/dev/null 2>&1; then
              echo "PyPI уже отдаёт $pkg $V"; have=$((have + 1))
            else
              echo "на PyPI нет $pkg $V"
            fi
          done
          if [ "$have" = 2 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Сборка
        if: steps.check.outputs.skip == '0'
        run: |
          python -m pip install --quiet build
          python -m build
          python -m build packaging/inn-check-ru-mcp --outdir dist
          ls -1 dist

      # Колесо без канона порогов публиковать нельзя: droblenie_check из
      # установленного пакета отвечал бы «не проверено». Ставим колесо в
      # чистый venv и проверяем из другой директории (не из checkout).
      - name: Колесо содержит canon и CLI работает из чистого venv
        if: steps.check.outputs.skip == '0'
        shell: bash
        run: |
          # без grep -q: под pipefail ранний выход grep роняет unzip по SIGPIPE
          # dist/inn_check_ru-*.whl — только движок: у обёртки после имени `_mcp`
          unzip -Z1 dist/inn_check_ru-*.whl | grep -Fx 'inn_check_ru_data/canon_ru.json' \
            || { echo "в колесе нет inn_check_ru_data/canon_ru.json" >&2; exit 1; }
          python -m venv "$RUNNER_TEMP/whl-venv"
          "$RUNNER_TEMP/whl-venv/bin/pip" install --quiet dist/inn_check_ru-*.whl
          cd "$RUNNER_TEMP"
          # некорректный ИНН -> JSON с ошибкой и exit 1: это и есть ожидаемый ответ
          out=$("$RUNNER_TEMP/whl-venv/bin/inn-check-ru" 123 || true)
          grep -F 'Некорректный ИНН' <<<"$out"
          "$RUNNER_TEMP/whl-venv/bin/python" - <<'PY'
          import droblenie_check as d
          canon = d._load_canon()
          assert isinstance(canon, dict) and "ндс_усн_освобождение" in canon, canon
          print("canon из колеса ok:", sorted(canon))
          # Последний рубеж перед PyPI: забытый py-module ломает установленный
          # пакет, работая из репозитория. check_access делает `import proxy`.
          import check_access, proxy
          assert proxy.настройка(None, env={"HTTPS_PROXY": "http://у:3128"})["источник"]
          assert "сеть" in check_access.build_report([], "неизвестно")
          print("прокси из колеса ok")
          PY

      # Та самая команда, которую соберёт клиент реестра MCP по server.json.
      # До 1.11.1 она запускала CLI проверки ИНН вместо сервера, и узнать это
      # можно было только запуском. Колёса берутся из dist, mcp SDK — с PyPI.
      - name: "`uvx inn-check-ru-mcp` поднимает сервер (путь реестра MCP)"
        if: steps.check.outputs.skip == '0'
        shell: bash
        env:
          V: ${{ steps.tag.outputs.version }}
        run: |
          python -m pip install --quiet uv
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/eval/mcp_handshake.py" \
            uvx --no-cache --find-links "$GITHUB_WORKSPACE/dist" "inn-check-ru-mcp==$V"

      - name: Публикация
        if: steps.check.outputs.skip == '0'
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          # Перезапуск после частичной публикации: уже залитый файл той же
          # версии пропускается, недостающий доливается.
          skip-existing: true
          # Без verbose PyPI-отказ выглядит как голое «400 Bad Request» без
          # причины (так упал v1.11.1: колесо движка залилось, следующий файл —
          # нет, и почему — лог не сказал). Причина отказа — в теле ответа.
          verbose: true

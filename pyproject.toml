[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Пакет на PyPI: тот же движок, что едет со скиллом, без копии кода.
# py-modules показывают на scripts/ (плоские модули — структура скилла не
# ломается: `python3 scripts/...` и `npx skills add` работают как раньше),
# MCP-обёртка едет пакетом inn_check_ru_mcp из mcp/, канон порогов
# data/canon_ru.json — package-data пакета inn_check_ru_data из data/
# (droblenie_check ищет канон: путь репозитория -> importlib.resources).
# Версия одна на репозиторий: гейт eval/run_version_gate.py.
[project]
name = "inn-check-ru"
version = "1.9.0"
description = "Проверка российского контрагента по ИНН: светофор риска по открытым реестрам (ЕГРЮЛ, ГИР БО, МСП, санкции РФМ/OFAC/EU), финансовая патология и признаки дробления кодом. CLI и MCP-сервер."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ilya Utov" }]
keywords = ["inn", "egrul", "counterparty", "due-diligence", "kyc", "sanctions", "russia", "mcp", "agent-skill"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Russian",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
# движок — чистый stdlib; MCP SDK нужен только MCP-обёртке (extra mcp)
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]

[project.urls]
Repository = "https://github.com/ilyautov/inn-check-ru"
Changelog = "https://github.com/ilyautov/inn-check-ru/blob/main/CHANGELOG.md"

[project.scripts]
inn-check-ru = "fetch_counterparty:cli"
inn-check-ru-mcp = "inn_check_ru_mcp.server:entry"

[tool.setuptools]
py-modules = [
  "fetch_counterparty",
  "fin_scoring",
  "sanctions_check",
  "affiliates_graph",
  "droblenie_check",
  "diff_counterparty",
  "registries_refresh",
  "check_access",
  "install_ca",
  "profiles",
  "sources",
  "batch_check",
  "snapshot",
  "watchlist",
  "opendata_refresh",
  "benchmarks",
  "paper_vat",
  "dossier",
  "extract_inn",
]
packages = ["inn_check_ru_mcp", "inn_check_ru_data"]

[tool.setuptools.package-dir]
"" = "scripts"
inn_check_ru_mcp = "mcp"
inn_check_ru_data = "data"

# канон порогов едет в колесо (без него droblenie_check из установленного
# пакета отвечает по выручке «не проверено»); проверка — CI-шаг «колесо
# содержит canon» и PUBLISHING.md
[tool.setuptools.package-data]
inn_check_ru_data = ["*.json"]
